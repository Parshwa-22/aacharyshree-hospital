# ===================== Server =====================
server.port=${PORT:8080}

# ===================== MySQL =====================
# Production values must be environment variables, never stored in Git.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aacharyshree_hospital?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:hospital_app}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== JPA / Hibernate =====================
# Use DB_DDL_AUTO=update only when first creating a new development database.
# Production uses validate once the schema has been created/migrated.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================== Media storage (Cloudinary) =====================
# All uploaded images/videos/thumbnails go to Cloudinary — not local disk.
# Cloudinary auto-optimizes (compresses) everything on upload via
# quality=auto,fetch_format=auto, and the returned CDN URL is what gets
# stored in the database.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:CHANGE_ME}
cloudinary.api-key=${CLOUDINARY_API_KEY:CHANGE_ME}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:CHANGE_ME}

# ===================== Payments (Razorpay) =====================
# Get these from https://dashboard.razorpay.com -> Settings -> API Keys.
# Start with TEST mode keys (they start with rzp_test_) until you're ready
# to accept real payments, then switch to the rzp_live_ keys.
razorpay.key-id=${RAZORPAY_KEY_ID:REPLACE_WITH_YOUR_RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:REPLACE_WITH_YOUR_RAZORPAY_KEY_SECRET}

# ===================== Email (Gmail SMTP — free) =====================
# 1. Use any Gmail account (a dedicated one for the hospital is best).
# 2. Turn on 2-Step Verification on that account (myaccount.google.com/security).
# 3. Create an "App Password": myaccount.google.com/apppasswords -> pick
#    "Mail" -> generate. Use THAT 16-character password below, not your
#    normal Gmail password.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:REPLACE_WITH_YOUR_GMAIL_ADDRESS@gmail.com}
spring.mail.password=${MAIL_PASSWORD:REPLACE_WITH_YOUR_16_CHAR_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from-name=${MAIL_FROM_NAME:Aacharyshree Hospital}
app.mail.logo-url=${MAIL_LOGO_URL:}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ===================== CORS =====================
# Comma-separated list of origins allowed to call this API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# ===================== JWT =====================
# CHANGE THIS before deploying anywhere. Must be at least 32 characters
# (256 bits) for HS256. Generate one with: openssl rand -base64 48
jwt.secret=${JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================== Admin registration =====================
# Anyone who knows this secret can create an admin account via
# POST /api/auth/register. Change it, and consider disabling/removing the
# endpoint entirely once your admin accounts are created.
admin.registration.secret=${ADMIN_REGISTRATION_SECRET:CHANGE_ME_REGISTRATION_SECRET}
